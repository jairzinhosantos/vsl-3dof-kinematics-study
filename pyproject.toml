[project]
name = "vsl-3dof-kinematics-study"
version = "0.3.0"
description = "Estudio cinemático reproducible del robot VSL de 3 GDL, MIA UNI"
requires-python = ">=3.11"
dependencies = ["numpy>=2.3,<3", "matplotlib>=3.10,<4", "sympy>=1.14,<2", "plotly>=6,<7"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
